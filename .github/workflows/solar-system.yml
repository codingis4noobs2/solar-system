name: Solar System Workflow
on:
    workflow_dispatch:
    push:
        branches:
            - main
            - 'feature/*'

env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS 22
          uses: actions/setup-node@v6
          with:
            node-version: 22
        
        - name: Cache Dependencies
          uses: actions/cache@v5
          with:
            path: ~/.npm
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

        - name: Install dependencies
          run: npm install

        - name: Unit Testing
          id: nodejs-unit-testing-step
          run: npm test

        - name: Archive Test Results
          if: always()
          uses: actions/upload-artifact@v7
          with:
            name: Mocha Test Result
            path: test-results.xml
    
    code_coverage:
        name: Code Coverage
        container:
            image: node:22
        services:
            mongo-db:
                image: siddharth67/mongo-db:non-prod
                ports:
                    - 27017:27017
                options:
                    --name mongo
                env:
                    MONGO_URI: 'mongodb://mongo:27017/superData'
                    MONGO_USERNAME: non-prod-user
                    MONGO_PASSWORD: non-prod-password
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Cache Dependencies
          uses: actions/cache@v5
          with:
            path: ~/.npm
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

        - name: Install dependencies
          run: npm install

        - name: Check Code Coverage
          continue-on-error: true
          run: npm run coverage

        - name: Archive Test Results
          uses: actions/upload-artifact@v7
          with:
            name: Code Coverage Result
            path: coverage
            retention-days: 5

    docker:
        name: Containerization
        needs: [unit-testing, code_coverage]
        permissions: 
            packages: write
            contents: read
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repo
          uses: actions/checkout@v4

        - name: Dockerhub login
          uses: docker/login-action@v2.2.0
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }} 
            password: ${{ secrets.DOCKERHUB_PASSWORD }}

        - name: GHCR login
          uses: docker/login-action@v2.2.0
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }} 
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Docker Build for testing
          uses: docker/build-push-action@v7
          with:
            context: .
            push: false
            tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

        - name: Docker image testing
          run: |
            docker images
            docker run --name solar-system-app -d \
                -p 3000:3000 \
                -e MONGO_URI=$MONGOURI \
                -e MONGO_USERNAME=$MONGO_USERNAME \
                -e MONGO_PASSWORD=$MONGOPASSWORD \
                ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

            export IP=$(docker inspect -f '{{range .NetworkSettings.Network}}{{.IPAddress}}{{end}}' solar-system-app)
            echo $IP

            echo 'Testing Image URL using wget'
            wget -q -O - 127.0.0.1:3000/live | grep live

        - name: Container Registry Push
          uses: docker/build-push-action@v7
          with:
            context: .
            push: true
            tags: |
                ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
                ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

    dev_deploy:
      needs: docker
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repo
          uses: actions/checkout@v4

        - name: Install kubectl CLI
          uses: azure/setup-kubectl@v3
          with: 
            version: 'v1.26.0'
        
        - name: start minikube
          id: minikube
          uses: medyagh/setup-minikube@latest

        - name: Fetch kubernetes cluster details
          run: |
            kubectl version
            echo ---------------------
            kubectl get nodes

        - name: Enable Ingress
          run: |
            minikube addons enable ingress

        - name: Save nginx ingress controller IP as github env
          run: |
            echo "INGRESS_IP=$(minikube ip)" >> $GITHUB_ENV

        - name: Replace token in manifest files
          uses: cschleiden/replace-tokens@v1
          with:
            tokenPrefix: '${'
            tokenSuffix: '}'
            files: '["kubernetes/development/*.yaml"]'
          env:
            NAMESPACE: ${{vars.NAMESPACE}}
            REPLICAS: ${{vars.REPLICAS}}
            IMAGE: ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}}
            INGRESS_IP: ${{env.INGRESS_IP}}

        - name: Check files
          run: |
            cat kubernetes/development/*.yaml

        - name: Create namespace
          run: |
           kubectl create namespace development

        - name: Create MongoDB secret
          run: |
            kubectl -n ${{vars.NAMESPACE}} create secret generic mongo-db-creds \
            --from-literal=MONGO_URI=${{env.MONGO_URI}} \
            --from-literal=MONGO_USERNAME=${{env.MONGO_USERNAME}} \
            --from-literal=MONGO_PAsSWORD=${{secrets.MONGO_PASSWORD}} \
            --save-config \
            --dry-run=client \
            -o yaml | kubectl apply -f -

        - name: Deploy to Dev Env
          run: |
            kubectl apply -f kubernetes/development